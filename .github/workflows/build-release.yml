name: Android Release CI/CD

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Generate debug.keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Verify keystore
        run: |
          echo "Checking debug.keystore..."
          ls -lh debug.keystore
          keytool -list \
            -keystore debug.keystore \
            -storepass android

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Find Release APK
        id: apk
        run: |
          echo "Searching for generated APK..."

          APK_PATH=$(find . \
            -type f \
            -path "*/build/outputs/apk/release/*.apk" \
            | head -n 1)

          if [ -z "$APK_PATH" ]; then
            echo "ERROR: Release APK was not generated."
            echo "Searching all APK files..."
            find . -type f -name "*.apk" || true
            exit 1
          fi

          echo "APK found:"
          echo "$APK_PATH"

          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

          echo "APK details:"
          ls -lh "$APK_PATH"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SKYLINE-APK
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.apk_path }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

هسه سوِّ Commit للـWorkflow وشغّله من "Actions → Android Release CI/CD → Run workflow".

المفروض التسلسل يصير:

"Checkout" → "JDK 17" → "Generate debug.keystore" → "Build Release APK" → "Find Release APK" → "SKYLINE-APK"

إذا ظهر خطأ جديد، دز آخر جزء من الخطأ فقط وأنا أحدد لك الخطوة التالية مباشرة.
